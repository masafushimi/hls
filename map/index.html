let sortKey='default',sortDir=1;
const COLS=[['name','企業'],['seg','区分'],['stage','到達ステージ'],['state','現状'],['reasons','止まった理由'],['revival','復活'],['lastDate','最終接触'],['days','経過日数'],['usage','利用（登録/90日）'],['next','次アクション／復活トリガー'],['pri','優先度']];
function list(){let rows=DATA.filter(d=>pass(d));
 const so={won:0,open:1,hold:2,stall:3,lost:4,lead:5,none:6},po={'高':0,'中':1,'低':2},ro={A:0,B:1,C:2,'':3};
 rows.sort((a,b)=>{let x,y;
  if(sortKey==='default'){x=[so[a.state],ro[a.revival],po[a.pri]??3,-a.stage];y=[so[b.state],ro[b.revival],po[b.pri]??3,-b.stage];for(let i=0;i<x.length;i++)if(x[i]!==y[i])return (x[i]-y[i])*sortDir;return 0}
  if(sortKey==='days'){x=days(a.lastDate)??99999;y=days(b.lastDate)??99999}
  else if(sortKey==='state'){x=so[a.state];y=so[b.state]}else if(sortKey==='revival'){x=ro[a.revival];y=ro[b.revival]}else if(sortKey==='pri'){x=po[a.pri]??3;y=po[b.pri]??3}
  else if(sortKey==='reasons'){x=a.reasons.join();y=b.reasons.join()}else{x=a[sortKey];y=b[sortKey]}
  return (x>y?1:x<y?-1:0)*sortDir});
 let h='<thead><tr>'+COLS.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
 rows.forEach(d=>{const [sl,c]=STATES[d.state];const dd=days(d.lastDate);
  h+=`<tr data-n="${esc(d.name)}"><td><b>${esc(d.name)}</b>${risky(d)?' <span class="risk" style="color:var(--lost)">!</span>':''}</td><td>${d.seg}</td>
  <td style="--c:${v(c)}"><div class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=d.stage?'f':''}"></i>`).join('')}</div><span class="meta">${SHORT[d.stage]}</span></td>
  <td><span class="st" style="--c:${v(c)}">${sl}</span><div class="meta">${esc(d.status)}</div></td>
  <td>${d.reasons.map(r=>`<span class="tag">${r}</span>`).join('')||'<span class="meta">—</span>'}</td>
  <td>${d.revival?`<span class="rvb" style="--r:${v(REV[d.revival][1])}">${d.revival}</span>`:'—'}</td>
  <td>${esc(d.lastDate||'—')}</td><td class="days ${dd>180&&d.state!=='won'?'old':''}">${dd??'—'}</td><td>${esc(d.usage)}</td>
  <td>${esc(d.note)}<div class="meta">→ ${esc(d.next)}</div></td><td>${esc(d.pri)}</td></tr>`});
 document.getElementById('list').innerHTML=h+'</tbody>'}
function detail(n){const d=DATA.find(x=>x.name===n);if(!d)return;const [sl,c]=STATES[d.state];
 const F=[['業種',d.ind],['状況（原文）',d.status],['利用実績（登録/直近90日）',d.usage],['起点・チャネル',d.channel],['初回接触',d.first],['最終接触',d.last],['先方窓口',d.contact],['提案内容・条件',d.offer],['相手の反応',d.reaction],['止まった理由',d.reasons.map(r=>r+'：'+REASONS[r]).join(' ／ ')||'—'],['復活見込み',d.revival?REV[d.revival][0]+'：'+REV[d.revival][2]:'—'],['次アクション',d.next],['優先度',d.pri]];
 document.getElementById('panel').style.setProperty('--c',v(c));
 document.getElementById('panel').innerHTML=`<button class="close" onclick="closeM()">閉じる</button><h3>${esc(d.name)}</h3><span class="st" style="--c:${v(c)}">${sl}</span> <span class="meta">${d.seg}</span>
 <div class="stagebar">${SHORT.slice(1).map((s,i)=>`<div class="${i+1<=d.stage?'f':''}">${s}</div>`).join('')}</div>
 <div class="note"><b>現状メモ／復活トリガー：</b>${esc(d.note)}</div>
 <dl>${F.map(([k,x])=>`<dt>${k}</dt><dd>${esc(x||'—')}</dd>`).join('')}</dl>`;
 document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function render(){kpis();map();rev();list()}
// controls
document.getElementById('segf').innerHTML=['',...SEGS].map(s=>`<button class="chipbtn ${s===''?'on':''}" data-seg="${s}">${s||'すべて'}</button>`).join(' ');
document.getElementById('reasonf').innerHTML+=Object.keys(REASONS).map(r=>`<option>${r}</option>`).join('');
document.getElementById('legend').innerHTML=Object.values(STATES).map(([l,c])=>`<span><i class="dot" style="background:${v(c)}"></i>${l}</span>`).join('')+Object.values(REV).map(([l,c,t])=>`<span><b class="rvb" style="--r:${v(c)}">${l}</b> ${t}</span>`).join('')+'<span><b style="color:var(--lost)">!</b> 稼働中だが縮小・解約リスク</span>';
document.addEventListener('click',e=>{const t=e.target.closest('[data-n]');if(t){detail(t.dataset.n);return}
 const k=e.target.closest('.kpi');if(k){if(k.dataset.rev){f.rev=f.rev==='A'?'':'A';document.getElementById('revf').value=f.rev}else f.state=k.dataset.s;render();return}
 const s=e.target.closest('[data-seg]');if(s){f.seg=s.dataset.seg;document.querySelectorAll('[data-seg]').forEach(b=>b.classList.toggle('on',b===s));render();return}
 const h=e.target.closest('th[data-k]');if(h){const k2=h.dataset.k;if(sortKey===k2)sortDir*=-1;else{sortKey=k2;sortDir=1}list();return}
 if(e.target.id==='modal')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
document.getElementById('reasonf').onchange=e=>{f.reason=e.target.value;render()};
document.getElementById('revf').onchange=e=>{f.rev=e.target.value;render()};
document.getElementById('q').oninput=e=>{f.q=e.target.value;render()};
document.getElementById('reset').onclick=()=>{Object.keys(f).forEach(k=>f[k]='');sortKey='default';sortDir=1;document.getElementById('q').value='';document.getElementById('reasonf').value='';document.getElementById('revf').value='';document.querySelectorAll('[data-seg]').forEach(b=>b.classList.toggle('on',b.dataset.seg===''));render()};
document.getElementById('total').textContent=DATA.length;document.getElementById('newn').textContent=DATA.filter(d=>d.state==='none').length;
render();
</script></body></html>
